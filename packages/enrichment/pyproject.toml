[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "is-it-local-enrichment"
version = "0.1.0"
description = "Local LLM + self-hosted search ownership enrichment pipeline for Is It Local."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "tenacity>=8.3",
    "openai>=1.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
]

[tool.hatch.build.targets.wheel]
packages = ["enrichment"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
